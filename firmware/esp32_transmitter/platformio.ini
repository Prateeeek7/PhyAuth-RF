; PhyAuth-RF transmitter / attacker node (STX882 on GPIO4)
; Pick the env of the board the STX882 is wired to:
;   classic ESP32 DevKit (micro-USB, WROOM-32):  pio run -e esp32dev -t upload
;   ESP32-S3 DevKitC (USB-C, N16R8):             pio run -e esp32s3 -t upload
; Serial monitor: pio device monitor -b 115200
; Different data pin? add  -DTX_PIN_NUM=<gpio>  to build_flags.
[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.5.0
framework = arduino
board_build.f_cpu = 240000000L
monitor_speed = 115200
build_flags = -Wall

[env:esp32dev]
board = esp32dev
upload_speed = 921600

[env:esp32s3]
board = esp32-s3-devkitc-1
upload_speed = 460800
board_build.flash_mode = dio
board_build.flash_size = 16MB
