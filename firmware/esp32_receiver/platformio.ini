; PhyAuth-RF receiver / verifier node (SRX882 on GPIO14)
; Pick the env of the board the SRX882 is wired to:
;   classic ESP32 DevKit (micro-USB, WROOM-32):  pio run -e esp32dev -t upload
;   ESP32-S3 DevKitC (USB-C, N16R8):             pio run -e esp32s3 -t upload
; Serial monitor: pio device monitor -b 921600
; Different data pin? add  -DRX_PIN_NUM=<gpio>  to build_flags.
[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.5.0
framework = arduino
board_build.f_cpu = 240000000L
monitor_speed = 921600
build_flags = -O2 -Wall
; upload_port = /dev/cu.usbserial-0001
; monitor_port = /dev/cu.usbserial-0001

[env:esp32dev]
board = esp32dev
upload_speed = 921600

[env:esp32s3]
board = esp32-s3-devkitc-1
upload_speed = 460800
board_build.flash_mode = dio
board_build.flash_size = 16MB
